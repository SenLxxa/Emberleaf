plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Modrinth: Sodium + Iris, only to test the Emberleaf shader in the dev/test client
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	// the dev client keeps its own Emberleaf data (outfit, skins, settings) next to its run folder
	runs {
		client {
			vmArg "-Demberleaf.dataDir=${file('run/emberleaf-data').absolutePath}"
		}
		// the game tests never touch the real Emberleaf data of this PC
		configureEach {
			if (name == "clientGameTest") vmArg "-Demberleaf.dataDir=${file('build/run/clientGameTest/emberleaf-data').absolutePath}"
		}
	}

	mods {
		"emberleaf" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Automatic in-game test (src/gametest): creates a world, puts on a test outfit, takes screenshots.
// Run with: gradle.ps1 runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "emberleaf-gametest"
		enableGameTests = false
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Not shipped: only present in the test client so the shader pack is compiled and photographed under Iris
	localRuntime "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
	localRuntime "maven.modrinth:iris:1.11.7+26.3-fabric"
	// what the Emberleaf texture pack needs: entity models/animations, random + glowing mobs, connected glass, glowing ores
	localRuntime "maven.modrinth:entitytexturefeatures:7.2.7-fabric-26.3"
	localRuntime "maven.modrinth:entity-model-features:3.3.12-fabric-26.3"
	localRuntime "maven.modrinth:continuity:3.0.1+26.3"
}

// Helper: unpacks the Fabric API sources into build/fabric-api-sources for reading the API
tasks.register("fabricApiSources") {
	notCompatibleWithConfigurationCache("one-off helper that resolves configurations at execution time")
	doLast {
		def ids = configurations.compileClasspath.incoming.resolutionResult.allComponents
			.collect { it.id }
			.findAll { it instanceof ModuleComponentIdentifier && it.group == "net.fabricmc.fabric-api" }
		def result = dependencies.createArtifactResolutionQuery()
			.forComponents(ids)
			.withArtifacts(JvmLibrary, SourcesArtifact)
			.execute()
		def out = file("build/fabric-api-sources")
		result.resolvedComponents.each { component ->
			component.getArtifacts(SourcesArtifact).each { artifact ->
				if (artifact instanceof ResolvedArtifactResult) {
					copy { from zipTree(artifact.file); into out; exclude "META-INF/**" }
				}
			}
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
