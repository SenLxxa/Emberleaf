# Baut eine Emberleaf-Version auf einem sauberen GitHub-PC (wie emberleaf/tools/release.ps1), VEROEFFENTLICHT ABER NICHTS.
# Updates laufen seit 0.0.8 ueber die Emberleaf-Webseite: Die fertigen Dateien laedst du dort unter /upload hoch.
# Starten nur per Hand: Actions -> Build -> Run workflow, danach unten bei "Artifacts" die Zip herunterladen.
#
# Vorher: APP_VERSION (version.py) und version= (emberleaf-mod/gradle.properties) gleich setzen, nach main bringen.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: v
        run: |
          $v = [regex]::Match((Get-Content emberleaf/backend/version.py -Raw), 'APP_VERSION = "([^"]+)"').Groups[1].Value
          $m = [regex]::Match((Get-Content emberleaf-mod/gradle.properties -Raw), '(?m)^version=(.+)$').Groups[1].Value.Trim()
          if ($v -notmatch '^\d{1,4}\.\d{1,4}\.\d{1,4}$') { throw "APP_VERSION '$v' ist keine Version wie 0.0.3" }
          if ($v -ne $m) { throw "version.py ($v) und gradle.properties ($m) passen nicht zusammen" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Emberleaf $v"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Client-Mod bauen
        working-directory: emberleaf-mod
        run: |
          ./gradlew.bat --no-daemon --console=plain build
          if ($LASTEXITCODE -ne 0) { throw "Der Mod-Build ist fehlgeschlagen" }
          $jar = "build/libs/emberleaf-client-${{ steps.v.outputs.version }}.jar"
          if (-not (Test-Path $jar)) { throw "$jar wurde nicht gebaut" }
          New-Item -ItemType Directory -Force ../emberleaf/client-mod | Out-Null
          Copy-Item $jar ../emberleaf/client-mod/

      - name: Shader packen
        run: |
          python -I emberleaf-shader/make_pack.py
          if ($LASTEXITCODE -ne 0) { throw "Das Shader-Packen ist fehlgeschlagen" }

      - name: Emberleaf.exe bauen
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File emberleaf/tools/build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Der exe-Build ist fehlgeschlagen" }

      - name: Release-Dateien sammeln und pruefen
        working-directory: emberleaf
        run: |
          $version = "${{ steps.v.outputs.version }}"
          $out = "dist/release-$version"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = @()
          function Add-File($path, $kind) {
            if (-not (Test-Path $path)) { throw "$path fehlt" }
            $item = Get-Item $path
            Copy-Item $item.FullName (Join-Path $out $item.Name)
            $script:files += [ordered]@{
              name = $item.Name; kind = $kind; size = $item.Length
              sha256 = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
            }
          }
          Add-File "dist/Emberleaf.exe" "launcher"
          Add-File "client-mod/emberleaf-client-$version.jar" "mod"
          Get-ChildItem "packs/shaderpacks" -Filter "Emberleaf-*.zip" | ForEach-Object { Add-File $_.FullName "shaderpack" }
          $notes = if (Test-Path ../.github/release-notes.md) { (Get-Content ../.github/release-notes.md -Raw -Encoding utf8).Trim() } else { "Neue Emberleaf-Version." }
          $manifest = [ordered]@{ version = $version; notes = $notes; files = $files }
          [IO.File]::WriteAllText((Resolve-Path $out).Path + "/emberleaf-release.json", ($manifest | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Resolve-Path dist).Path + "/notes.md", $notes, (New-Object Text.UTF8Encoding($false)))
          $files | ForEach-Object { "{0,-34} {1,8:N0} KB  {2}" -f $_.name, ($_.size / 1KB), $_.kind }
          .venv/Scripts/python.exe -W ignore tools/verify_build.py $out
          if ($LASTEXITCODE -ne 0) { throw "Die Pruefung der Release-Dateien ist fehlgeschlagen" }

      - name: Fertige Dateien zum Herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: Emberleaf-${{ steps.v.outputs.version }}
          path: emberleaf/dist/release-${{ steps.v.outputs.version }}/
          retention-days: 14
